---
# =============================================================================
# ldap-create-user.yml — Ansible playbook to create an LDAP user in 389DS
# =============================================================================
#
# DESCRIPTION:
#   Creates a new POSIX user in 389 Directory Server with all required
#   attributes for Linux authentication via SSSD. Uses the community.general
#   collection's ldap_entry module.
#
# USAGE:
#   # Create a user with default values:
#   ansible-playbook ldap-create-user.yml \
#     -e "uid=mwisniewska first_name=Maria last_name=Wiśniewska uid_number=20003"
#
#   # Create a user with custom group and shell:
#   ansible-playbook ldap-create-user.yml \
#     -e "uid=pnowicki first_name=Paweł last_name=Nowicki uid_number=20004 gid_number=10001 login_shell=/bin/zsh"
#
#   # Set password (will prompt):
#   ansible-playbook ldap-create-user.yml \
#     -e "uid=mwisniewska first_name=Maria last_name=Wiśniewska uid_number=20003 user_password=MyPass123!"
#
# REQUIREMENTS:
#   - Ansible 2.9+
#   - Collection: community.general (install: ansible-galaxy collection install community.general)
#   - Python package: python-ldap (install: pip install python-ldap)
#   - Network access to LDAP server on port 636 (LDAPS)
#   - CA certificate trusted on the Ansible control node
#
# ANSIBLE CONCEPTS EXPLAINED:
#   - Extra vars (-e): variables passed on the command line. They have the
#     highest precedence — they override everything else (inventory, defaults).
#   - ldap_entry module: creates or ensures an LDAP entry exists. It is
#     IDEMPOTENT — running it twice with the same data won't create duplicates
#     or throw errors. This is a key Ansible principle: describe desired state.
#   - ldap_attrs module: modifies attributes on an existing entry. Used here
#     to set the password after the entry is created.
#   - delegate_to: localhost — LDAP operations run from the Ansible control
#     node, not from the remote host. The control node connects directly to
#     the LDAP server over the network.
#   - no_log: true — prevents sensitive data (passwords) from appearing in
#     Ansible output logs.
# =============================================================================

- name: Create LDAP user in 389 Directory Server
  hosts: localhost
  # Run on the control node — we connect to LDAP directly, not via SSH
  connection: local
  gather_facts: false

  # =========================================================================
  # VARIABLES
  # =========================================================================
  # These can be overridden with -e on the command line.
  # Required vars (no defaults): uid, first_name, last_name, uid_number
  vars:
    # LDAP connection settings
    ldap_uri: "ldaps://rhel-srv01.linux.lab.local:636"
    base_dn: "dc=linux,dc=lab,dc=local"
    people_ou: "ou=People,{{ base_dn }}"
    bind_dn: "cn=Directory Manager"
    # bind_password should be provided via:
    #   -e "bind_password=..." (NOT recommended — visible in process list)
    #   --ask-extra-vars (interactive)
    #   Ansible Vault (RECOMMENDED for production)
    #   Environment variable: LDAP_BIND_PASSWORD
    bind_password: "{{ lookup('env', 'LDAP_BIND_PASSWORD') | default(omit) }}"

    # User defaults (override with -e)
    gid_number: "10002"          # linuxusers group
    login_shell: "/bin/bash"
    # user_password: optional — if not set, password must be set manually

  tasks:
    # =========================================================================
    # VALIDATION
    # =========================================================================
    # Ansible best practice: validate inputs before making changes.
    # assert module fails the play with a clear message if conditions aren't met.

    - name: Validate required variables are provided
      ansible.builtin.assert:
        that:
          - uid is defined and uid | length > 0
          - first_name is defined and first_name | length > 0
          - last_name is defined and last_name | length > 0
          - uid_number is defined
        fail_msg: >-
          Missing required variables. Usage:
          ansible-playbook ldap-create-user.yml
          -e "uid=<login> first_name=<name> last_name=<surname> uid_number=<number>"
        success_msg: "All required variables provided: uid={{ uid }}, uid_number={{ uid_number }}"

    - name: Validate uid_number is a positive integer
      ansible.builtin.assert:
        that:
          - uid_number | int > 0
        fail_msg: "uid_number must be a positive integer, got: {{ uid_number }}"

    # =========================================================================
    # CREATE USER ENTRY
    # =========================================================================
    # community.general.ldap_entry ensures the LDAP entry exists.
    # If the entry already exists with the same DN, the task reports "ok" (no change).
    # If it doesn't exist, it creates it and reports "changed".
    #
    # This is IDEMPOTENT — safe to run multiple times.

    - name: Create LDAP user entry
      community.general.ldap_entry:
        server_uri: "{{ ldap_uri }}"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_password }}"
        # validate_certs: true requires CA cert in system trust store
        validate_certs: true
        dn: "uid={{ uid }},{{ people_ou }}"
        state: present
        objectClass:
          - inetOrgPerson
          - posixAccount
          - organizationalPerson
        attributes:
          uid: "{{ uid }}"
          cn: "{{ first_name }} {{ last_name }}"
          sn: "{{ last_name }}"
          givenName: "{{ first_name }}"
          displayName: "{{ first_name }} {{ last_name }}"
          uidNumber: "{{ uid_number }}"
          gidNumber: "{{ gid_number }}"
          homeDirectory: "/home/{{ uid }}"
          loginShell: "{{ login_shell }}"
      register: user_result

    - name: Report user creation result
      ansible.builtin.debug:
        msg: >-
          {{ 'Created new user' if user_result.changed else 'User already exists' }}:
          uid={{ uid }}, uidNumber={{ uid_number }},
          DN=uid={{ uid }},{{ people_ou }}

    # =========================================================================
    # SET PASSWORD (optional)
    # =========================================================================
    # Only runs if user_password variable is defined.
    # Uses ldap_attrs to modify the userPassword attribute.
    #
    # NOTE: In 389DS, when you set userPassword, the server automatically
    # hashes it using the configured password storage scheme (default: PBKDF2).
    # You provide plain text, the server stores the hash.

    - name: Set user password
      community.general.ldap_attrs:
        server_uri: "{{ ldap_uri }}"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_password }}"
        validate_certs: true
        dn: "uid={{ uid }},{{ people_ou }}"
        attributes:
          userPassword: "{{ user_password }}"
        state: exact
      when: user_password is defined and user_password | length > 0
      # no_log prevents the password from appearing in Ansible output
      no_log: true
      register: password_result

    - name: Report password result
      ansible.builtin.debug:
        msg: "{{ 'Password set successfully' if password_result.changed | default(false) else 'Password not changed (already set or not provided)' }}"

    # =========================================================================
    # VERIFICATION
    # =========================================================================
    # Query the newly created user to confirm it exists.
    # ldap_search returns matching entries as a list.

    - name: Verify user exists in LDAP
      community.general.ldap_search:
        server_uri: "{{ ldap_uri }}"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_password }}"
        validate_certs: true
        dn: "{{ people_ou }}"
        scope: "onelevel"
        filter: "(uid={{ uid }})"
        attrs:
          - uid
          - cn
          - uidNumber
          - gidNumber
          - homeDirectory
          - loginShell
      register: verify_result

    - name: Display created user
      ansible.builtin.debug:
        msg: "{{ verify_result.results }}"

    # =========================================================================
    # NEXT STEPS REMINDER
    # =========================================================================

    - name: Post-creation reminders
      ansible.builtin.debug:
        msg:
          - "User '{{ uid }}' is ready in LDAP."
          - "Next steps on SSSD clients:"
          - "  1. Clear SSSD cache: sss_cache -E && systemctl restart sssd"
          - "  2. Verify: getent passwd {{ uid }}"
          - "  3. Test login: ssh {{ uid }}@<client-hostname>"
