---
# =============================================================================
# ldap-lock-user.yml — Ansible playbook to lock or unlock an LDAP account
# =============================================================================
#
# DESCRIPTION:
#   Locks or unlocks a user account in 389 Directory Server by managing
#   the nsAccountLock attribute. Optionally resets the password retry counter.
#
# USAGE:
#   # Lock an account:
#   ansible-playbook ldap-lock-user.yml -e "uid=jkowalski action=lock"
#
#   # Unlock an account:
#   ansible-playbook ldap-lock-user.yml -e "uid=jkowalski action=unlock"
#
# REQUIREMENTS:
#   - Ansible 2.9+
#   - Collection: community.general
#   - Python package: python-ldap
#
# ANSIBLE CONCEPTS EXPLAINED:
#   - ldap_attrs module: modifies attributes on an existing LDAP entry.
#     Unlike ldap_entry (which creates/deletes entries), ldap_attrs only
#     changes attributes on entries that already exist.
#
#   - state parameter in ldap_attrs:
#     "exact"  — set the attribute to exactly this value (replace)
#     "present" — add value if not already present
#     "absent"  — remove the attribute entirely
#
#   - Idempotency: Running "lock" twice is safe — nsAccountLock stays "true".
#     Running "unlock" twice is safe — if nsAccountLock is already absent,
#     the task reports "ok" (no change).
#
#   - changed_when / failed_when: Override Ansible's default success/failure
#     detection. Useful when a command might "fail" in a non-critical way
#     (e.g., deleting an attribute that doesn't exist).
# =============================================================================

- name: Lock or unlock LDAP user account
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ldap_uri: "ldaps://rhel-srv01.linux.lab.local:636"
    base_dn: "dc=linux,dc=lab,dc=local"
    people_ou: "ou=People,{{ base_dn }}"
    services_ou: "ou=Services,{{ base_dn }}"
    bind_dn: "cn=Directory Manager"
    bind_password: "{{ lookup('env', 'LDAP_BIND_PASSWORD') | default(omit) }}"
    # Required: uid and action (lock/unlock)

  tasks:
    # =========================================================================
    # VALIDATION
    # =========================================================================

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - uid is defined and uid | length > 0
          - action is defined and action in ['lock', 'unlock']
        fail_msg: >-
          Missing or invalid variables. Usage:
          ansible-playbook ldap-lock-user.yml -e "uid=<username> action=lock|unlock"

    # =========================================================================
    # FIND THE USER
    # =========================================================================
    # Search both OUs to find the user. This handles users in either
    # People or Services OU without the caller needing to know which.

    - name: Search for user in People OU
      community.general.ldap_search:
        server_uri: "{{ ldap_uri }}"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_password }}"
        validate_certs: true
        dn: "{{ people_ou }}"
        scope: "onelevel"
        filter: "(uid={{ uid }})"
        attrs:
          - uid
          - cn
          - nsAccountLock
          - passwordRetryCount
      register: people_search
      no_log: true

    - name: Search for user in Services OU
      community.general.ldap_search:
        server_uri: "{{ ldap_uri }}"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_password }}"
        validate_certs: true
        dn: "{{ services_ou }}"
        scope: "onelevel"
        filter: "(uid={{ uid }})"
        attrs:
          - uid
          - cn
          - nsAccountLock
          - passwordRetryCount
      register: services_search
      ignore_errors: true
      no_log: true

    - name: Determine user DN
      ansible.builtin.set_fact:
        user_entry: >-
          {{ (people_search.results + (services_search.results | default([]))) | first | default(None) }}

    - name: Verify user was found
      ansible.builtin.assert:
        that:
          - user_entry is not none
          - user_entry != 'None'
        fail_msg: "User '{{ uid }}' not found in {{ people_ou }} or {{ services_ou }}"

    - name: Extract user DN
      ansible.builtin.set_fact:
        user_dn: "{{ user_entry.dn }}"

    # =========================================================================
    # SHOW CURRENT STATUS
    # =========================================================================

    - name: Display current account status
      ansible.builtin.debug:
        msg:
          - "User:             {{ [user_entry.uid] | flatten | first }} ({{ [user_entry.cn] | flatten | first | default('N/A') }})"
          - "DN:               {{ user_dn }}"
          - "Currently locked: {{ [user_entry.nsAccountLock] | flatten | first | default('false') }}"
          - "Failed attempts:  {{ [user_entry.passwordRetryCount] | flatten | first | default('0') }}"
          - "Action:           {{ action | upper }}"

    # =========================================================================
    # LOCK ACCOUNT
    # =========================================================================
    # Set nsAccountLock=true using state=exact (idempotent replace).

    - name: Lock account — set nsAccountLock=true
      community.general.ldap_attrs:
        server_uri: "{{ ldap_uri }}"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_password }}"
        validate_certs: true
        dn: "{{ user_dn }}"
        attributes:
          nsAccountLock: "true"
        state: exact
      when: action == "lock"
      register: lock_result

    - name: Report lock result
      ansible.builtin.debug:
        msg: >-
          {{ '🔒 Account LOCKED successfully' if lock_result.changed | default(false)
             else '🔒 Account was already locked (no change)' }}
      when: action == "lock"

    # =========================================================================
    # UNLOCK ACCOUNT
    # =========================================================================
    # Two steps:
    # 1. Remove nsAccountLock attribute (state=absent)
    # 2. Reset passwordRetryCount to 0

    - name: Unlock account — remove nsAccountLock
      community.general.ldap_attrs:
        server_uri: "{{ ldap_uri }}"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_password }}"
        validate_certs: true
        dn: "{{ user_dn }}"
        attributes:
          nsAccountLock: "true"
        state: absent
      when: action == "unlock"
      register: unlock_result
      # Don't fail if nsAccountLock didn't exist
      ignore_errors: true

    - name: Unlock account — reset password retry count
      community.general.ldap_attrs:
        server_uri: "{{ ldap_uri }}"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_password }}"
        validate_certs: true
        dn: "{{ user_dn }}"
        attributes:
          passwordRetryCount: "0"
        state: exact
      when: action == "unlock"
      register: reset_result

    - name: Report unlock result
      ansible.builtin.debug:
        msg:
          - "🔓 Account UNLOCKED successfully"
          - "   nsAccountLock removed: {{ unlock_result.changed | default(false) }}"
          - "   Retry count reset:    {{ reset_result.changed | default(false) }}"
      when: action == "unlock"

    # =========================================================================
    # VERIFY FINAL STATE
    # =========================================================================

    - name: Verify final account state
      community.general.ldap_search:
        server_uri: "{{ ldap_uri }}"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_password }}"
        validate_certs: true
        dn: "{{ user_dn }}"
        scope: "base"
        filter: "(objectClass=*)"
        attrs:
          - uid
          - nsAccountLock
          - passwordRetryCount
      register: final_state
      no_log: true

    - name: Display final state
      ansible.builtin.debug:
        msg:
          - "Final state for {{ uid }}:"
          - "  Locked:          {{ [final_state.results[0].nsAccountLock] | flatten | first | default('false') }}"
          - "  Failed attempts: {{ [final_state.results[0].passwordRetryCount] | flatten | first | default('0') }}"

    # =========================================================================
    # SSSD CACHE REMINDER
    # =========================================================================

    - name: SSSD cache reminder
      ansible.builtin.debug:
        msg:
          - "⚠️  Remember to clear SSSD cache on clients:"
          - "   sss_cache -E && systemctl restart sssd"
          - ""
          - "   Or use Ansible to clear cache on all clients:"
          - "   ansible clients -m shell -a 'sss_cache -E && systemctl restart sssd'"
