[defaults]
# Use the builtin default callback with yaml result_format.
# community.general.yaml was removed in community.general 12.0.0;
# the replacement is result_format=yaml in [callback_default] below.
stdout_callback      = default

localhost_warning    = false
deprecation_warnings = false
display_skipped_hosts = false

# Render task results as YAML blocks instead of JSON — makes multiline
# debug messages readable (no literal \n in output).
[callback_default]
result_format = yaml
