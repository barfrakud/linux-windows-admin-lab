---
# =============================================================================
# ldap-check-expiry.yml — Ansible playbook to check LDAP account expiry
# =============================================================================
#
# DESCRIPTION:
#   Queries 389 Directory Server for password and account expiry information.
#   Can check a specific user or all users in the People OU.
#   Outputs a formatted report with expiry dates and warnings.
#
# USAGE:
#   # Check all users:
#   ansible-playbook ldap-check-expiry.yml
#
#   # Check a specific user:
#   ansible-playbook ldap-check-expiry.yml -e "target_uid=jkowalski"
#
# REQUIREMENTS:
#   - Ansible 2.9+
#   - Collection: community.general
#   - Python package: python-ldap
#
# ANSIBLE CONCEPTS EXPLAINED:
#   - ldap_search module: queries LDAP and returns results as a list of dicts.
#     Each dict represents one LDAP entry with its attributes.
#   - loop / with_items: iterates over a list, running the task once per item.
#   - set_fact: creates a variable that persists for the rest of the play.
#   - Jinja2 filters: Ansible uses Jinja2 templating. Filters like
#     | default('N/A'), | int, | ternary('yes','no') transform values inline.
#   - register: captures the result of a task into a variable for later use.
# =============================================================================

- name: Check LDAP account expiry
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ldap_uri: "ldaps://rhel-srv01.linux.lab.local:636"
    base_dn: "dc=linux,dc=lab,dc=local"
    people_ou: "ou=People,{{ base_dn }}"
    bind_dn: "cn=Directory Manager"
    bind_password: "{{ lookup('env', 'LDAP_BIND_PASSWORD') | default(omit) }}"
    # Optional: check only a specific user
    # target_uid: "jkowalski"

  tasks:
    # =========================================================================
    # SEARCH FOR USERS
    # =========================================================================
    # Build the LDAP filter dynamically based on whether target_uid is set.
    # If target_uid is defined: search for that specific user.
    # If not: search for all posixAccount entries in People OU.
    #
    # Operational attributes (passwordExpirationTime, nsAccountLock, etc.)
    # require explicit listing in attrs — they are NOT returned by default.

    - name: Set LDAP search filter
      ansible.builtin.set_fact:
        ldap_filter: "{{ '(uid=' + target_uid + ')' if target_uid is defined else '(objectClass=posixAccount)' }}"

    - name: Query LDAP for user accounts with expiry attributes
      community.general.ldap_search:
        server_uri: "{{ ldap_uri }}"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_password }}"
        validate_certs: true
        dn: "{{ people_ou }}"
        scope: "onelevel"
        filter: "{{ ldap_filter }}"
        attrs:
          - uid
          - cn
          - nsAccountLock
          - passwordExpirationTime
          - passwordRetryCount
          - accountUnlockTime
          - createTimestamp
          - modifyTimestamp
      register: ldap_users
      no_log: true

    - name: Check if any users were found
      ansible.builtin.assert:
        that:
          - ldap_users.results | length > 0
        fail_msg: "No users found matching filter: {{ ldap_filter }}"
        success_msg: "Found {{ ldap_users.results | length }} user(s)"

    # =========================================================================
    # GENERATE REPORT
    # =========================================================================
    # We iterate over each user entry and build a formatted report.
    #
    # The ldap_search module returns entries as a list of dicts like:
    # [
    #   {
    #     "dn": "uid=jkowalski,ou=People,dc=linux,dc=lab,dc=local",
    #     "uid": ["jkowalski"],
    #     "cn": ["Jan Kowalski"],
    #     "passwordExpirationTime": ["20261231235959Z"],
    #     ...
    #   }
    # ]
    #
    # Note: LDAP attributes are always returned as LISTS (even single-valued).
    # That's why we use [0] to get the first (and usually only) value.

    - name: Build expiry report header
      ansible.builtin.set_fact:
        expiry_report:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "LDAP Account Expiry Report"
          - "Server:      {{ ldap_uri }}"
          - "Search base: {{ people_ou }}"
          - "Date:        {{ lookup('pipe', 'date \"+%Y-%m-%d %H:%M:%S\"') }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      no_log: true

    - name: Append per-user expiry rows
      ansible.builtin.set_fact:
        expiry_report: >-
          {{
            expiry_report + [
              '',
              'User:            ' + ([item.uid] | flatten | first | default('N/A'))
                                 + ' (' + ([item.cn] | flatten | first | default('N/A')) + ')',
              'DN:              ' + item.dn,
              'Account locked:  ' + ([item.nsAccountLock] | flatten | first | default('false') | string),
              'Password expiry: ' + ([item.passwordExpirationTime] | flatten | first | default('NEVER (no expiry set)') | string),
              'Failed attempts: ' + ([item.passwordRetryCount] | flatten | first | default('0') | string),
              'Created:         ' + ([item.createTimestamp] | flatten | first | default('N/A') | string),
              'Last modified:   ' + ([item.modifyTimestamp] | flatten | first | default('N/A') | string)
            ]
            + (['Auto-unlock at:  ' + ([item.accountUnlockTime] | flatten | first | string)]
               if item.accountUnlockTime is defined else [])
          }}
      loop: "{{ ldap_users.results }}"
      loop_control:
        label: "{{ [item.uid] | flatten | first }}"
      no_log: true

    - name: Append expiry report footer
      ansible.builtin.set_fact:
        expiry_report: >-
          {{
            expiry_report
            + ['',
               '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━',
               'Total accounts checked: ' + (ldap_users.results | length | string)]
          }}
      no_log: true

    - name: Display account expiry report
      ansible.builtin.debug:
        msg: "{{ expiry_report }}"

    # =========================================================================
    # OPTIONAL: IDENTIFY ACCOUNTS NEEDING ATTENTION
    # =========================================================================
    # Filter the results to find only locked or expired accounts.
    # This uses Jinja2 selectattr filter to narrow down the list.

    - name: Identify locked accounts
      ansible.builtin.set_fact:
        locked_accounts: >-
          {{ ldap_users.results
             | selectattr('nsAccountLock', 'defined')
             | list }}

    - name: Report locked accounts
      ansible.builtin.debug:
        msg: >-
          {{
            ['Locked accounts: ' + (locked_accounts | length | string)]
            + (locked_accounts
               | map(attribute='uid') | flatten
               | zip(locked_accounts | map(attribute='cn') | flatten)
               | zip(locked_accounts | map(attribute='nsAccountLock') | flatten)
               | map('flatten')
               | map('join', '|')
               | map('regex_replace', '^(.+)\|(.+)\|(.+)$', '  [LOCKED] \1 (\2) — nsAccountLock=\3')
               | list)
            + (['  None — all accounts are active.'] if locked_accounts | length == 0 else [])
          }}
