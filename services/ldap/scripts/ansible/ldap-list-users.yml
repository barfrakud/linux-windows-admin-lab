---
# =============================================================================
# ldap-list-users.yml — Ansible playbook to list all LDAP users
# =============================================================================
#
# DESCRIPTION:
#   Queries 389 Directory Server and displays all user accounts with their
#   POSIX attributes. Supports filtering by group (gidNumber).
#
# USAGE:
#   ansible-playbook ldap-list-users.yml
#   ansible-playbook ldap-list-users.yml -e "include_services=true"
#   ansible-playbook ldap-list-users.yml -e "gid_filter=10001"
#
# ANSIBLE CONCEPTS EXPLAINED:
#   - ldap_search: returns a list of dicts. Each LDAP attribute is a list
#     (even single-valued) because LDAP allows multi-valued attributes.
#   - Jinja2 format filter: {{ '%%-16s' | format(value) }} for column alignment.
#   - default filter: provides fallback when attribute is missing.
# =============================================================================

- name: List all LDAP users
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ldap_uri: "ldaps://rhel-srv01.linux.lab.local:636"
    base_dn: "dc=linux,dc=lab,dc=local"
    people_ou: "ou=People,{{ base_dn }}"
    services_ou: "ou=Services,{{ base_dn }}"
    bind_dn: "cn=Directory Manager"
    bind_password: "{{ lookup('env', 'LDAP_BIND_PASSWORD') | default(omit) }}"
    include_services: false
    # gid_filter: 10001  # uncomment or pass via -e to filter by group

  tasks:
    # =========================================================================
    # BUILD FILTER
    # =========================================================================

    - name: Set LDAP search filter
      ansible.builtin.set_fact:
        ldap_filter: >-
          {{ '(&(objectClass=posixAccount)(gidNumber=' + gid_filter | string + '))'
             if gid_filter is defined
             else '(objectClass=posixAccount)' }}
      no_log: true

    # =========================================================================
    # SEARCH PEOPLE OU
    # =========================================================================

    - name: Search users in People OU
      community.general.ldap_search:
        server_uri: "{{ ldap_uri }}"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_password }}"
        validate_certs: true
        dn: "{{ people_ou }}"
        scope: "onelevel"
        filter: "{{ ldap_filter }}"
        attrs:
          - uid
          - cn
          - uidNumber
          - gidNumber
          - homeDirectory
          - loginShell
          - nsAccountLock
      register: people_results
      no_log: true

    # =========================================================================
    # OPTIONALLY SEARCH SERVICES OU
    # =========================================================================

    - name: Search service accounts
      community.general.ldap_search:
        server_uri: "{{ ldap_uri }}"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_password }}"
        validate_certs: true
        dn: "{{ services_ou }}"
        scope: "onelevel"
        filter: "{{ ldap_filter }}"
        attrs:
          - uid
          - cn
          - uidNumber
          - gidNumber
          - homeDirectory
          - loginShell
          - nsAccountLock
      register: service_results
      when: include_services | bool
      ignore_errors: true
      no_log: true

    # =========================================================================
    # COMBINE AND DISPLAY
    # =========================================================================

    - name: Combine results
      ansible.builtin.set_fact:
        all_users: >-
          {{ people_results.results | default([])
             + (service_results.results | default([])) }}
      no_log: true

    # Build report as a list of strings.
    # debug: msg=<list> renders each element on its own line in all Ansible
    # callback versions — avoids the \n-escaped blob from msg=<multiline string>.

    - name: Build report header
      ansible.builtin.set_fact:
        report_lines:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "LDAP User Listing"
          - "Server: {{ ldap_uri }}"
          - "Filter: {{ ldap_filter }}"
          - "Date:   {{ lookup('pipe', 'date \"+%Y-%m-%d %H:%M:%S\"') }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - ""
          - "ou=People ({{ people_results.results | length }} accounts):"
          - "  {{ '%-16s' | format('UID') }} {{ '%-25s' | format('CN') }} {{ '%-8s' | format('UIDNUM') }} {{ '%-8s' | format('GIDNUM') }} SHELL"
          - "  {{ '%-16s' | format('────────────────') }} {{ '%-25s' | format('─────────────────────────') }} {{ '%-8s' | format('────────') }} {{ '%-8s' | format('────────') }} ───────────────"
      no_log: true

    - name: Append user rows
      ansible.builtin.set_fact:
        report_lines: >-
          {{
            report_lines + [
              '  ' + '%-16s' | format([item.uid]        | flatten | first)
              + ' ' + '%-25s' | format([item.cn]         | flatten | first | default('N/A'))
              + ' ' + '%-8s'  | format([item.uidNumber]  | flatten | first)
              + ' ' + '%-8s'  | format([item.gidNumber]  | flatten | first)
              + ' ' + ([item.loginShell] | flatten | first | default('/bin/bash'))
              + (' [LOCKED]' if item.nsAccountLock is defined else '')
            ]
          }}
      loop: "{{ people_results.results }}"
      loop_control:
        label: "{{ [item.uid] | flatten | first }}"
      no_log: true

    - name: Append footer
      ansible.builtin.set_fact:
        report_lines: >-
          {{
            report_lines
            + (['  (no accounts found)'] if people_results.results | length == 0 else [])
            + ['', '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━',
               'Total: ' + (all_users | length | string) + ' account(s)']
          }}
      no_log: true

    - name: Display user listing
      ansible.builtin.debug:
        msg: "{{ report_lines }}"
