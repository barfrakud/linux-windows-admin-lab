---
# =============================================================================
# ldap-reset-password.yml — Ansible playbook to reset LDAP user password
# =============================================================================
#
# DESCRIPTION:
#   Resets the password for an LDAP user. Supports explicit password or
#   random generation. This is the most common help desk operation.
#
# USAGE:
#   # Set a specific password:
#   ansible-playbook ldap-reset-password.yml \
#     -e "uid=jkowalski new_password=TempPass123!"
#
#   # Generate a random password:
#   ansible-playbook ldap-reset-password.yml \
#     -e "uid=jkowalski generate_password=true"
#
# SECURITY NOTE:
#   Passwords passed via -e are visible in /proc and ps output.
#   For production use:
#   - Use Ansible Vault: ansible-vault encrypt_string 'password'
#   - Use a vars_prompt for interactive input
#   - Use lookup('env', 'NEW_PASSWORD')
#
# ANSIBLE CONCEPTS EXPLAINED:
#   - lookup('password', ...): Ansible's built-in password generator.
#     'password /dev/null' generates a random password without saving it.
#     chars= controls the character set.
#     length= controls the password length.
#
#   - vars_prompt: allows interactive input when running the playbook.
#     With private: true, the input is hidden (like read -s in bash).
#     Not used here for simplicity, but recommended for production.
#
#   - no_log: true: prevents task output from showing in logs.
#     Critical for password operations — without it, the password
#     appears in plain text in Ansible's output.
# =============================================================================

- name: Reset LDAP user password
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ldap_uri: "ldaps://rhel-srv01.linux.lab.local:636"
    base_dn: "dc=linux,dc=lab,dc=local"
    people_ou: "ou=People,{{ base_dn }}"
    services_ou: "ou=Services,{{ base_dn }}"
    bind_dn: "cn=Directory Manager"
    bind_password: "{{ lookup('env', 'LDAP_BIND_PASSWORD') | default(omit) }}"
    # Password options (choose one):
    # new_password: "ExplicitPassword123!"
    generate_password: false
    password_length: 16

  tasks:
    # =========================================================================
    # VALIDATION
    # =========================================================================

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - uid is defined and uid | length > 0
        fail_msg: >-
          Missing uid. Usage:
          ansible-playbook ldap-reset-password.yml -e "uid=<username> new_password=<pass>"
          OR -e "uid=<username> generate_password=true"

    - name: Validate password source
      ansible.builtin.assert:
        that:
          - new_password is defined or generate_password | bool
        fail_msg: >-
          No password source specified. Provide either:
          -e "new_password=<password>" or -e "generate_password=true"

    # =========================================================================
    # VERIFY USER EXISTS
    # =========================================================================

    - name: Search for user
      community.general.ldap_search:
        server_uri: "{{ ldap_uri }}"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_password }}"
        validate_certs: true
        dn: "{{ people_ou }}"
        scope: "onelevel"
        filter: "(uid={{ uid }})"
        attrs:
          - uid
          - cn
          - nsAccountLock
      register: user_search

    - name: Try Services OU if not in People
      community.general.ldap_search:
        server_uri: "{{ ldap_uri }}"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_password }}"
        validate_certs: true
        dn: "{{ services_ou }}"
        scope: "onelevel"
        filter: "(uid={{ uid }})"
        attrs:
          - uid
          - cn
          - nsAccountLock
      register: service_search
      when: user_search.results | length == 0

    - name: Determine user DN
      ansible.builtin.set_fact:
        target_user: >-
          {{ (user_search.results + (service_search.results | default([]))) | first }}
      failed_when: (user_search.results + (service_search.results | default([]))) | length == 0

    - name: Warn if account is locked
      ansible.builtin.debug:
        msg: "⚠️  Account '{{ uid }}' is LOCKED. Password will be set but user cannot login until unlocked."
      when: target_user.nsAccountLock is defined

    # =========================================================================
    # GENERATE OR USE PROVIDED PASSWORD
    # =========================================================================

    - name: Generate random password
      ansible.builtin.set_fact:
        effective_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits,punctuation length=' + password_length | string) }}"
      when: generate_password | bool and new_password is not defined
      no_log: true

    - name: Use provided password
      ansible.builtin.set_fact:
        effective_password: "{{ new_password }}"
      when: new_password is defined
      no_log: true

    - name: Display generated password
      ansible.builtin.debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "  Generated password for {{ uid }}:"
          - "  {{ effective_password }}"
          - ""
          - "  Communicate securely to the user."
          - "  Instruct them to change it on first login."
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      when: generate_password | bool and new_password is not defined

    # =========================================================================
    # SET PASSWORD
    # =========================================================================

    - name: Set user password
      community.general.ldap_attrs:
        server_uri: "{{ ldap_uri }}"
        bind_dn: "{{ bind_dn }}"
        bind_pw: "{{ bind_password }}"
        validate_certs: true
        dn: "{{ target_user.dn }}"
        attributes:
          userPassword: "{{ effective_password }}"
        state: exact
      no_log: true
      register: password_result

    - name: Report result
      ansible.builtin.debug:
        msg: >-
          {{ '✅ Password reset successfully for ' + uid
             if password_result.changed
             else '⚠️  Password unchanged (may already be set to this value)' }}

    # =========================================================================
    # REMINDERS
    # =========================================================================

    - name: Post-reset reminders
      ansible.builtin.debug:
        msg:
          - "Next steps:"
          - "  1. Clear SSSD cache on clients: sss_cache -E && systemctl restart sssd"
          - "  2. Inform user of new password (via secure channel, not email!)"
          - "  3. User should change password on first login"
